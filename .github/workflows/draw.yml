name: Draw

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: draw
  cancel-in-progress: false

jobs:
  draw:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm draw
        env:
          NOTES_FILE: ${{ runner.temp }}/notes.md
      - run: pnpm verify
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: data/result.json
      - name: Commit and release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ runner.temp }}/notes.md
        run: |
          cat "$NOTES" >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/result.json
          git commit -m "Draw winners"
          git push
          gh release create draw --target "$(git rev-parse HEAD)" --title "Tirage au sort" --notes-file "$NOTES" \
            data/result.json
